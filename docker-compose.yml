services:
  tak-db:
    build:
      context: .
      dockerfile: Dockerfile.takserver-db
    container_name: tak_postgres
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_PASSWORD=atakatak
    networks:
      - tak-network
    volumes:
      - tak_db_data:/var/lib/postgresql/data
      - ./tak:/opt/tak

  tak-server:
    build:
      context: .
      dockerfile: Dockerfile.takserver
    container_name: tak_core
    restart: always
    depends_on:
      - tak-db
    ports:
      - "8089:8089"
      - "8446:8446"
      - "8443:8443"
      - "8444:8444"
    networks:
      - tak-network
      - proxy-network
    volumes:
      - ./tak:/opt/tak

  grafana:
    image: grafana/grafana:latest
    container_name: tak_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - tak-network
      - proxy-network

  tak-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: tak_bot
    depends_on:
      - tak-server
    restart: always
    command: ["sh", "-c", "sleep 60 && python manager.py"]
    environment:
      - TAK_HOST=tak-server
      # Adresse, unter der ATAK den Server erreicht (fuer den Bild-Anhang-Download).
      # Wird aus der .env neben dieser Datei gelesen (NUC: Tailscale-IP).
      - TAK_PUBLIC_HOST=${TAK_PUBLIC_HOST:?TAK_PUBLIC_HOST in .env setzen}
      - PYTHONUNBUFFERED=1
    networks:
      - tak-network
    volumes:
      - ./microservices:/app

  tak-worker:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: tak_worker
    depends_on:
      - tak-server
    restart: always
    command: ["python", "task_worker.py"]
    environment:
      - TAK_HOST=tak-server
      - PYTHONUNBUFFERED=1
    networks:
      - tak-network
    volumes:
      - ./microservices:/app

  tak-mesh-gateway:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: tak_mesh_gateway
    depends_on:
      - tak-server
    restart: always
    command: ["python", "meshtastic_manager.py"] 
    environment:
      - MESH_PORT=/dev/ttyACM0
      # Nur fuer setup_mesh_device.py (Provisionierung), Werte aus .env
      - MESH_CHANNEL_NAME=${MESH_CHANNEL_NAME:-TAK-Erlangen}
      - MESH_PSK=${MESH_PSK:-}
      - DEFAULT_LAT=${DEFAULT_LAT:-49.5897}
      - DEFAULT_LON=${DEFAULT_LON:-11.0039}
      - PYTHONUNBUFFERED=1
    # T-Beam (CH9102) am NUC. Stabiler Pfad ueber /dev/serial/by-id, im
    # Container immer /dev/ttyACM0. Ohne Geraet am Host schlaegt "docker
    # compose up" fehl -> MESH_DEVICE in .env anpassen.
    devices:
      - "${MESH_DEVICE:-/dev/serial/by-id/usb-1a86_USB_Single_Serial_5B21228838-if00}:/dev/ttyACM0"
    networks:
      - tak-network
    volumes:
      - ./microservices:/app

networks:
  tak-network:
    driver: bridge
  proxy-network:
    external: true

volumes:
  tak_db_data:
  grafana_data:
